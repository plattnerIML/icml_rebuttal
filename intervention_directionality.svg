<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: "CMU Serif", "Computer Modern", "Latin Modern Roman", "Times New Roman", Georgia, serif; }
    .label { font-size: 11px; fill: #2c2c2c; }
    .label-it { font-size: 11px; fill: #2c2c2c; font-style: italic; }
    .label-sm { font-size: 9.5px; fill: #606060; }
    .label-sm-it { font-size: 9.5px; fill: #606060; font-style: italic; }
    .math { font-size: 11px; fill: #2c2c2c; font-style: italic; }
    .block-label { font-size: 10.5px; fill: #2c2c2c; }
    .site-label { font-size: 9px; }
    .sym { font-size: 10px; font-weight: 500; }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="#2c2c2c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Residual stream axis -->
  <line x1="56" y1="152" x2="624" y2="152" stroke="#2c2c2c" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- Block tick marks on the stream -->
  <line x1="100" y1="148" x2="100" y2="156" stroke="#2c2c2c" stroke-width="0.6"/>
  <line x1="200" y1="148" x2="200" y2="156" stroke="#2c2c2c" stroke-width="0.6"/>
  <line x1="320" y1="148" x2="320" y2="156" stroke="#2c2c2c" stroke-width="0.6"/>
  <line x1="440" y1="148" x2="440" y2="156" stroke="#2c2c2c" stroke-width="0.6"/>
  <line x1="540" y1="148" x2="540" y2="156" stroke="#2c2c2c" stroke-width="0.6"/>

  <!-- Block labels below ticks -->
  <text class="block-label" x="100" y="172" text-anchor="middle">MLP(0)</text>
  <text class="block-label" x="200" y="172" text-anchor="middle">CA(3)</text>
  <text class="block-label" x="320" y="172" text-anchor="middle" font-weight="600" fill="#9e3520">CA(4)</text>
  <text class="block-label" x="440" y="172" text-anchor="middle">MLP(5)</text>
  <text class="block-label" x="540" y="172" text-anchor="middle" fill="#808080">…31</text>

  <!-- Axis labels -->
  <text class="label-sm" x="56" y="186" text-anchor="middle">block 0</text>
  <text class="label-sm" x="636" y="152" text-anchor="start" dominant-baseline="central" font-style="italic" fill="#2c2c2c">Z</text>

  <!-- Top annotation: t = 7 -->
  <text class="label" x="340" y="24" text-anchor="middle"><tspan font-style="italic">t</tspan> = 7  (first denoising step)</text>

  <!-- Causal site marker -->
  <circle cx="320" cy="152" r="10" fill="none" stroke="#9e3520" stroke-width="1.2"/>
  <line x1="320" y1="140" x2="320" y2="68" stroke="#9e3520" stroke-width="0.6" stroke-dasharray="3 2.5"/>
  <text class="label-sm-it" x="320" y="58" text-anchor="middle" fill="#9e3520">corruption enters</text>

  <!-- PowerRemap zone -->
  <rect x="72" y="204" width="276" height="1" rx="0" fill="#2a7a5a" opacity="0.5"/>
  <line x1="72" y1="200" x2="72" y2="208" stroke="#2a7a5a" stroke-width="0.6" opacity="0.5"/>
  <line x1="348" y1="200" x2="348" y2="208" stroke="#2a7a5a" stroke-width="0.6" opacity="0.5"/>

  <text class="label-sm" x="60" y="228" fill="#2a7a5a" font-style="italic">PowerRemap</text>
  <text class="label-sm" x="60" y="241" fill="#7a7a7a">reshapes spectrum before causal site</text>

  <!-- PowerRemap check/cross indicators -->
  <text class="sym" x="100" y="208" text-anchor="middle" dominant-baseline="hanging" fill="#2a7a5a">✓</text>
  <text class="sym" x="200" y="208" text-anchor="middle" dominant-baseline="hanging" fill="#2a7a5a">✓</text>
  <text class="sym" x="320" y="208" text-anchor="middle" dominant-baseline="hanging" fill="#2a7a5a">✓</text>
  <text class="sym" x="440" y="208" text-anchor="middle" dominant-baseline="hanging" fill="#aaa">✗</text>
  <text class="sym" x="540" y="208" text-anchor="middle" dominant-baseline="hanging" fill="#aaa">✗</text>

  <!-- Patching zone -->
  <rect x="292" y="274" width="276" height="1" rx="0" fill="#4a4090" opacity="0.45"/>
  <line x1="292" y1="270" x2="292" y2="278" stroke="#4a4090" stroke-width="0.6" opacity="0.45"/>
  <line x1="568" y1="270" x2="568" y2="278" stroke="#4a4090" stroke-width="0.6" opacity="0.45"/>

  <text class="label-sm" x="580" y="262" fill="#4a4090" font-style="italic">Patching</text>
  <text class="label-sm" x="580" y="275" fill="#7a7a7a">imports healthy residual history</text>

  <!-- Patching check/cross indicators -->
  <text class="sym" x="100" y="278" text-anchor="middle" dominant-baseline="hanging" fill="#aaa">✗</text>
  <text class="sym" x="200" y="278" text-anchor="middle" dominant-baseline="hanging" fill="#aaa">✗</text>
  <text class="sym" x="320" y="278" text-anchor="middle" dominant-baseline="hanging" fill="#4a4090">✓</text>
  <text class="sym" x="440" y="278" text-anchor="middle" dominant-baseline="hanging" fill="#4a4090">✓</text>
  <text class="sym" x="540" y="278" text-anchor="middle" dominant-baseline="hanging" fill="#4a4090">✓</text>

  <!-- Bracket: 765/768 no rescue -->
  <line x1="440" y1="222" x2="540" y2="222" stroke="#bbb" stroke-width="0.4"/>
  <line x1="440" y1="220" x2="440" y2="224" stroke="#bbb" stroke-width="0.4"/>
  <line x1="540" y1="220" x2="540" y2="224" stroke="#bbb" stroke-width="0.4"/>
  <text class="label-sm" x="490" y="236" text-anchor="middle" fill="#999">C ≈ 140</text>

  <!-- Summary: 3/768 -->
  <text class="label-sm" x="340" y="322" text-anchor="middle" fill="#606060">3 of 768 sites rescue  ·  all at <tspan font-style="italic">t</tspan> = 7  ·  all on the residual-stream pathway to CA(4, 7)</text>

</svg>